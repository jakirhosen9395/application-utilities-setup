services:
  mongodb:
    image: mongo:8.0.15
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: "micro_services_user"
      MONGO_INITDB_ROOT_PASSWORD: "qUQPCY51eTZPx6FL7HJjlXjF30vfIhwo"
      MONGO_INITDB_DATABASE: "micro_services_db"

    ports:
      - "27017:27017"

    volumes:
      - /opt/volumes/mongodb/data:/data/db

    networks:
      - mongo_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u micro_services_user -p qUQPCY51eTZPx6FL7HJjlXjF30vfIhwo --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  mongo_network:
    driver: bridge
  

