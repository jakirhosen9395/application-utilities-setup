services:
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: "microuser"
      POSTGRES_PASSWORD: "jhsdhaoHHLKDJSLdmioe234"
      POSTGRES_DB: "microservice_db"

    ports:
      - "5432:5432"

    volumes:
      - /opt/volumes/postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microuser -d microservice_db -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - postgres_network

networks:
  postgres_network:
    driver: bridge


